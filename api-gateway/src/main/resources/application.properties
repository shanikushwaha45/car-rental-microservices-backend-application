spring.application.name=api-gateway
server.port=8762

eureka.client.service-url.defaultZone=http://localhost:8761/eureka/
eureka.client.register-with-eureka=true
eureka.client.fetch-registry=true

spring.cloud.gateway.server.webmvc.routes[0].id=car-service
spring.cloud.gateway.server.webmvc.routes[0].uri=lb://CAR-SERVICE
spring.cloud.gateway.server.webmvc.routes[0].predicates[0]=Path=/api/cars/**

spring.cloud.gateway.server.webmvc.routes[1].id=owner-service
spring.cloud.gateway.server.webmvc.routes[1].uri=lb://OWNER-SERVICE
spring.cloud.gateway.server.webmvc.routes[1].predicates[0]=Path=/api/owners/**
